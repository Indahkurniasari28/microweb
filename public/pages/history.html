<!-- HISTORY PAGE -->
<div class="flex flex-col gap-lg max-w-[1440px]">

  <!-- Page Header -->
  <header class="flex justify-between items-end">
    <div>
      <h1 class="font-headline-lg text-headline-lg text-on-surface">Download History</h1>
      <p class="font-body-md text-on-surface-variant mt-xs">Manage and export historical lab instrumentation datasets.</p>
    </div>
    <div class="flex items-center gap-xs bg-surface-container rounded-lg p-xs border border-outline-variant">
      <button id="filter-all" class="px-lg py-xs font-label-caps text-label-caps bg-primary/20 text-primary border border-primary/50 rounded-[6px] transition-all">ALL</button>
      <button id="filter-rc" class="px-lg py-xs font-label-caps text-label-caps text-red-400/60 hover:text-red-400 hover:bg-red-500/10 border border-transparent hover:border-red-500/30 rounded-[6px] transition-all">RC</button>
      <button id="filter-mg" class="px-lg py-xs font-label-caps text-label-caps text-emerald-400/60 hover:text-emerald-400 hover:bg-emerald-500/10 border border-transparent hover:border-emerald-500/30 rounded-[6px] transition-all">MG</button>
      <button id="filter-mb" class="px-lg py-xs font-label-caps text-label-caps text-blue-400/60 hover:text-blue-400 hover:bg-blue-500/10 border border-transparent hover:border-blue-500/30 rounded-[6px] transition-all">MB</button>
    </div>
  </header>

  <!-- Filter Bar -->
  <section class="flex flex-wrap items-center gap-md p-md bg-surface-container/50 backdrop-blur-md border border-outline-variant rounded-xl">
    <div class="flex flex-col">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-xs">Dari Tanggal</label>
      <input id="hist-date-from" type="date"
        class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-sm font-body-md focus:border-primary outline-none">
    </div>
    <div class="flex flex-col">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-xs">Hingga Tanggal</label>
      <input id="hist-date-to" type="date"
        class="bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-md py-sm font-body-md focus:border-primary outline-none">
    </div>
    <div class="flex items-end self-end gap-sm">
      <button id="btn-hist-filter" class="bg-surface-container-highest/50 border border-outline-variant text-on-surface px-md py-sm rounded-lg hover:bg-surface-container-high transition-colors flex items-center gap-sm font-body-md">
        <span class="material-symbols-outlined text-[20px]">filter_list</span> Filter
      </button>
      <button id="btn-export-csv" class="bg-primary text-on-primary font-bold px-lg py-sm rounded-lg flex items-center gap-sm hover:opacity-90 transition-opacity font-body-md">
        <span class="material-symbols-outlined text-[20px]">download</span> Export CSV
      </button>
    </div>
  </section>

  <!-- Data Table -->
  <section class="glass-panel rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-surface-container-low/50">
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase">Waktu</th>
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase">Absorbansi</th>
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase">Konsentrasi (ppm)</th>
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase">Degradasi (%)</th>
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase">Status</th>
            <th class="px-lg py-md font-label-caps text-label-caps text-on-surface-variant uppercase text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="history-table-body" class="divide-y divide-outline-variant/30">
          <tr>
            <td colspan="6" class="px-lg py-lg text-center text-on-surface-variant font-body-md">
              <div class="flex flex-col items-center gap-sm">
                <span class="material-symbols-outlined text-[40px] text-outline">database</span>
                <span>Tidak ada data</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="px-lg py-md bg-surface-container-high/10 border-t border-outline-variant flex items-center justify-between">
      <span id="hist-count-label" class="text-xs text-on-surface-variant">Menampilkan 0 record</span>
      <div class="flex items-center gap-xs">
        <button id="hist-prev" class="p-xs rounded border border-outline-variant hover:bg-surface-container-high transition-colors text-on-surface-variant disabled:opacity-30">
          <span class="material-symbols-outlined text-[18px]">chevron_left</span>
        </button>
        <span id="hist-page-info" class="px-sm py-xs bg-primary text-on-primary rounded text-xs font-bold">1</span>
        <button id="hist-next" class="p-xs rounded border border-outline-variant hover:bg-surface-container-high transition-colors">
          <span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>
    </div>
  </section>

</div>
